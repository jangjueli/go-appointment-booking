services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appointment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pga:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      PGADMIN_DEFAULT_EMAIL: root@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 1234
      PGADMIN_ENABLE_PROXY: "True"
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres   

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Bangkok
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: appointment
    depends_on:
      - postgres      

volumes:
  postgres_data:
  pgadmin_data:
